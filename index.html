    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts: DM Sans, Mea Culpa, Pinyon Script, Rouge Script, Monsieur La Doulaise, Bowlby One SC -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Mea+Culpa&family=Pinyon+Script&family=Rouge+Script&family=Monsieur+La+Doulaise&family=Bowlby+One+SC&display=swap" rel="stylesheet">
    <script id="fetch-fix">
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when sub-dependencies try to polyfill fetch in environments where it is a protected property.
      (function() {
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch shim failed:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
